name: One-time sync of astro-core from Eco
on:
  push:
    branches: [split-upload]
    paths: ['.github/workflows/sync-eco.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: split-upload
      - uses: actions/checkout@v4
        with:
          repository: prayagi-store-and-services/netra-eco-app
          ref: prayagideepak-collab-patch-31
          path: eco-src
      - name: Copy files
        run: |
          rm -rf astro-core/src
          cp -r eco-src/astro-core/src astro-core/src
          cp eco-src/build.gradle.kts build.gradle.kts
          cp eco-src/gradle.properties gradle.properties
          mkdir -p scripts && cp eco-src/scripts/ui-standard-check.sh scripts/ui-standard-check.sh
          rm -rf eco-src
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat | tail -3
          git commit -m "Sync astro-core sources from Eco patch-31 (split)" || echo nothing
          git push origin split-upload
