name: One-time sync of city list from Eco
on:
  push:
    branches: [split-upload]
    paths: ['.github/workflows/sync-tsv.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: split-upload
      - uses: actions/checkout@v4
        with:
          repository: prayagi-store-and-services/netra-eco-app
          ref: prayagideepak-collab-patch-31
          path: eco-src
      - name: Copy files
        run: |
          mkdir -p app/src/main/assets
          cp eco-src/app/src/main/assets/2-trikaal_cities.tsv app/src/main/assets/2-trikaal_cities.tsv
          rm -rf eco-src
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add offline city list (copied from Eco patch-31)" || echo nothing
          git push origin split-upload
